# pySLAM Configuration for Semantic Feature Extractor
# This config uses the trained semantic keypoint model instead of ORB

# Feature extractor settings
FEATURE:
  type: 'SEMANTIC'  # Custom type for our semantic extractor
  num_features: 500
  semantic_checkpoint: '/workspace/semantic-slam/checkpoints/best_model.pth'

# Camera settings (will be overridden by sequence-specific settings)
CAMERA:
  fps: 30
  width: 640
  height: 480

# Tracking settings
TRACKING:
  # Matcher settings for L2-normalized descriptors
  matcher_type: 'BF'  # Brute-force matcher
  matcher_norm: 'L2'  # L2 norm for cosine similarity
  ratio_test: 0.8     # Lowe's ratio test threshold

  # Use semantic features for tracking
  use_motion_model: true

# Local mapping settings
LOCAL_MAPPING:
  keyframe_min_observations: 50
  keyframe_max_observations: 100

# Loop closing (disable for now - focus on tracking accuracy)
LOOP_CLOSING:
  enabled: false

# Visualization
VIEWER:
  enabled: false  # Headless for evaluation

# Output settings
OUTPUT:
  save_trajectory: true
  save_map: false
  trajectory_format: 'tum'  # TUM format for evo evaluation