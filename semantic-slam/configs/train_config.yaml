# Training Configuration for Hybrid Semantic-Geometric SLAM
# Following DINO-VO architecture with geometric constraints

# Model architecture
model:
  # DINOv3 backbone (frozen)
  backbone: "vit_small_patch16_dinov3.lvd1689m"
  input_size: 448
  num_keypoints: 500

  # Geometric CNN
  geometric_channels: 64

  # Feature fusion
  fusion_dim: 256  # semantic (384) + geometric (64) → 256

  # Descriptor
  descriptor_dim: 128
  refiner_hidden: 256
  refiner_layers: 3

  # Sub-pixel offset
  enable_offset: true
  offset_hidden: 128

# Dataset configuration - ALL TUM SEQUENCES!
dataset:
  root: "data/tum_rgbd"

  # TRAINING: Mix of all difficulty levels and cameras
  train_sequences:
    # Freiburg 1 (Kinect v1) - Good texture
    - "rgbd_dataset_freiburg1_desk"
    - "rgbd_dataset_freiburg1_desk2"
    - "rgbd_dataset_freiburg1_room"
    - "rgbd_dataset_freiburg1_teddy"
    # Freiburg 1 - Low texture (include in training!)
    - "rgbd_dataset_freiburg1_plant"
    - "rgbd_dataset_freiburg1_floor"
    # Freiburg 2 (different location)
    - "rgbd_dataset_freiburg2_desk"
    # Freiburg 3 (Kinect v2 - different camera)
    - "rgbd_dataset_freiburg3_sitting_xyz"
    - "rgbd_dataset_freiburg3_sitting_static"

  # VALIDATION: 2 sequences (mix of fr1 and fr3)
  val_sequences:
    - "rgbd_dataset_freiburg1_xyz"
    - "rgbd_dataset_freiburg3_walking_static"

  # TEST: For final evaluation ONLY - never seen during training
  test_sequences:
    - "rgbd_dataset_freiburg3_long_office_household"
    - "rgbd_dataset_freiburg3_walking_xyz"

  frame_spacing: 1
  max_frames: null  # Use all frames

  # Heavy augmentation for better generalization
  augmentation:
    enabled: true
    # Photometric
    brightness: 0.3
    contrast: 0.3
    hue: 0.15
    saturation: 0.3
    gaussian_blur: 0.5
    # Geometric (NEW!)
    rotation: 15  # degrees
    scale: [0.85, 1.15]

# Loss configuration - GEOMETRIC FOCUS!
loss:
  weights:
    # Descriptor losses
    ap: 2.0              # R2D2's AP loss (MAIN descriptor loss)
    variance: 1.0        # Prevent collapse

    # Geometric losses (CRITICAL!)
    epipolar: 1.5        # Enforce F matrix constraint
    depth_reproj: 1.0    # Use RGB-D depth for 3D consistency
    photometric: 0.5     # Appearance consistency

    # Detector losses
    repeatability: 2.0   # Keypoint stability (INCREASED from 0.5)
    semantic_edge: 1.5   # Your idea! Align with semantic boundaries (INCREASED from 0.3)

    # Sub-pixel loss
    offset: 0.5          # Offset prediction accuracy

  # AP loss config
  ap_kappa: 0.5         # Minimum expected AP

  # Epipolar config
  epipolar_threshold: 3.0  # pixels

  # Variance config
  min_variance: 0.005   # For 128-dim descriptors

# Training configuration - 3 STAGE APPROACH
training:
  # Stage 1: Geometric CNN pre-training (2 weeks)
  stage1_epochs: 10
  stage1_lr: 1e-4
  stage1_focus: "geometric"  # Train only geometric CNN

  # Stage 2: Full training (3 weeks)
  stage2_epochs: 40
  stage2_lr: 1e-4
  stage2_lr_min: 1e-6

  # Stage 3: Offset refinement (1 week)
  stage3_epochs: 10
  stage3_lr: 5e-5

  batch_size: 4
  weight_decay: 1e-4
  grad_clip: 1.0
  num_workers: 4
  warmup_epochs: 3

  val_interval: 1
  save_interval: 5
  save_dir: "checkpoints"

# Logging
logging:
  use_wandb: false
  project: "semantic-slam-hybrid"
  run_name: "dino-cnn-geometric-v1"
  log_interval: 50

# Camera intrinsics (TUM RGB-D)
camera:
  # Freiburg 1 & 2
  fr1_fx: 517.3
  fr1_fy: 516.5
  fr1_cx: 318.6
  fr1_cy: 255.3

  # Freiburg 3
  fr3_fx: 535.4
  fr3_fy: 539.2
  fr3_cx: 320.1
  fr3_cy: 247.6