# Training Configuration - FIXED
# Key changes:
# 1. InfoNCE loss instead of AP loss
# 2. Geometric consistency loss for Stage 2
# 3. Adaptive keypoint selection parameters
# 4. Better loss weights based on DINO-VO

# Model architecture
model:
  # DINOv3 backbone (frozen)
  backbone: "vit_small_patch16_dinov3.lvd1689m"
  input_size: 448
  num_keypoints: 500

  # Geometric CNN
  geometric_channels: 64

  # Feature fusion
  fusion_dim: 256

  # Descriptor
  descriptor_dim: 128
  refiner_hidden: 256
  refiner_layers: 3

  # Sub-pixel offset (Stage 3)
  enable_offset: true
  offset_hidden: 128

# Dataset configuration
dataset:
  root: "data/tum_rgbd"

  # TRAINING: Mix of all sequences
  train_sequences:
    # Freiburg 1 (Kinect v1)
    - "rgbd_dataset_freiburg1_desk"
    - "rgbd_dataset_freiburg1_desk2"
    - "rgbd_dataset_freiburg1_room"
    - "rgbd_dataset_freiburg1_teddy"
    - "rgbd_dataset_freiburg1_plant"  # Low texture
    - "rgbd_dataset_freiburg1_floor"  # Low texture
    # Freiburg 2
    - "rgbd_dataset_freiburg2_desk"
    # Freiburg 3 (Kinect v2)
    - "rgbd_dataset_freiburg3_sitting_xyz"
    - "rgbd_dataset_freiburg3_sitting_static"

  # VALIDATION
  val_sequences:
    - "rgbd_dataset_freiburg1_xyz"
    - "rgbd_dataset_freiburg3_walking_static"

  # TEST (final evaluation only)
  test_sequences:
    - "rgbd_dataset_freiburg3_long_office_household"
    - "rgbd_dataset_freiburg3_walking_xyz"

  frame_spacing: 1
  max_frames: null

  # Heavy augmentation
  augmentation:
    enabled: true
    brightness: 0.3
    contrast: 0.3
    hue: 0.15
    saturation: 0.3
    gaussian_blur: 0.5
    rotation: 15
    scale: [0.85, 1.15]

# Loss configuration - UPDATED!
loss:
  weights:
    # CORE LOSSES (InfoNCE replaces AP)
    infonce: 2.0           # Primary descriptor loss (CHANGED from 'ap')
    variance: 1.0          # Prevent collapse
    epipolar: 1.5          # Geometric consistency
    depth_reproj: 1.0      # 3D consistency

    # SECONDARY LOSSES
    repeatability: 0.5     # Keypoint stability
    semantic_edge: 0.5     # Semantic boundary alignment

    # OPTIONAL LOSSES
    photometric: 0.3       # Appearance consistency
    offset: 0.5            # Sub-pixel refinement (Stage 3)

    # NEW: Geometric consistency (prevents Stage 2 degradation!)
    geo_consistency: 0.5   # Keep geometric features edge-responsive

  # InfoNCE config
  infonce_temperature: 0.07  # Following DINO-VO

  # Epipolar config
  epipolar_threshold: 3.0

  # Variance config
  min_variance: 0.005

# Keypoint selection parameters - CRITICAL FIXES!
keypoints:
  nms_radius: 4              # Pixels, not patches!
  score_threshold: 0.1       # Only keep high-quality keypoints
  adaptive_selection: true   # Don't force 500 if quality is low

# Training configuration
training:
  # Stage 1: Geometric CNN (1 week)
  stage1_epochs: 10
  stage1_lr: 1e-4

  # Stage 2: Full training (2-3 weeks)
  stage2_epochs: 40
  stage2_lr: 1e-4
  stage2_lr_min: 1e-6

  # Stage 3: Offset refinement (1 week)
  stage3_epochs: 10
  stage3_lr: 5e-5

  batch_size: 4
  weight_decay: 1e-4
  grad_clip: 1.0
  num_workers: 4
  warmup_epochs: 3

  val_interval: 1
  save_interval: 5
  save_dir: "checkpoints"

# Logging
logging:
  use_wandb: false
  project: "semantic-slam-hybrid-fixed"
  run_name: "infonce-geo-consistency-v1"
  log_interval: 50

# Camera intrinsics (loaded per-sample from dataset)
camera:
  fr1_fx: 517.3
  fr1_fy: 516.5
  fr1_cx: 318.6
  fr1_cy: 255.3

  fr3_fx: 535.4
  fr3_fy: 539.2
  fr3_cx: 320.1
  fr3_cy: 247.6