# SOTA 2025 Training Configuration for Semantic Keypoint Detection
# FIXED: Now trains on varied frame spacings for better generalization

# Model architecture
model:
  backbone: "vit_small_patch16_dinov3.lvd1689m"
  input_size: 448
  num_keypoints: 500
  selector_hidden: 128
  descriptor_dim: 128
  refiner_hidden: 384
  refiner_layers: 4

# Dataset configuration
dataset:
  root: "data/tum_rgbd"

  # Training sequences
  train_sequences:
    - "rgbd_dataset_freiburg1_desk"
    - "rgbd_dataset_freiburg1_room"
    - "rgbd_dataset_freiburg3_walking_static"

  # Validation sequences
  val_sequences:
    - "rgbd_dataset_freiburg1_plant"

  # CRITICAL FIX: Random frame spacing [1, 2, 3, 5]
  # This ensures model learns to match frames with varying motion
  # Training randomly samples from this list each batch
  frame_spacing: [1, 2, 3, 5]  # CHANGED FROM: 1

  max_frames: null

  # Data augmentation
  augmentation:
    enabled: true
    brightness: 0.2
    contrast: 0.2
    hue: 0.1
    saturation: 0.2
    gaussian_blur: 0.3

# Loss configuration - EXACTLY 4 LOSSES
loss:
  weights:
    descriptor: 10.0
    homographic: 1.0
    peakiness: 5.0
    offset: 0.15

  # Descriptor loss parameters
  temperature: 0.07

  # Peakiness loss parameters
  target_variance: 0.22
  target_mean: 0.30

  # Offset loss parameters
  max_offset: 0.3

# Training configuration
training:
  epochs: 40
  batch_size: 4
  lr: 1.0e-4
  lr_min: 1.0e-6
  weight_decay: 1.0e-4
  grad_clip: 1.0
  num_workers: 4

  # Validation and checkpointing
  val_interval: 1
  save_interval: 5
  save_dir: "checkpoints"

# Logging configuration
logging:
  use_wandb: false
  project: "semantic-slam-thesis"
  run_name: "sota-2025-varied-spacing-v1"  # UPDATED name