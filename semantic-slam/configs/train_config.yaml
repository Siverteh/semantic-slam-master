# Training Configuration - Two-Stage (R2D2-style)
# SIMPLIFIED: Only 4 essential losses

# Model architecture
model:
  backbone: "vit_small_patch16_dinov3.lvd1689m"
  input_size: 448
  num_keypoints: 500

  selector_hidden: 256
  selector_layers: 3

  descriptor_dim: 128
  refiner_hidden: 384
  refiner_layers: 4

  estimator_hidden: 128

# Dataset configuration
dataset:
  root: "data/tum_rgbd"

  # TRAINING: 3 sequences
  train_sequences:
    - "rgbd_dataset_freiburg1_desk"
    - "rgbd_dataset_freiburg1_room"
    - "rgbd_dataset_freiburg3_walking_static"

  # VALIDATION: 1 sequence
  val_sequences:
    - "rgbd_dataset_freiburg1_plant"

  # TEST (for final evaluation only - not during training!)
  test_sequences:
    - "rgbd_dataset_freiburg3_long_office_household"
    - "rgbd_dataset_freiburg3_walking_xyz"

  frame_spacing: 1
  max_frames: null

  # Data augmentation
  augmentation:
    enabled: true
    brightness: 0.2
    contrast: 0.2
    hue: 0.1
    saturation: 0.2
    gaussian_blur: 0.3

# Loss configuration - RESEARCH-INFORMED (DeDoDe + ALIKE + SuperPoint)
loss:
  # Stage 1 weights (detector + descriptor)
  weights:
    desc: 10.0        # Descriptor matching (DOMINANT - all papers agree)
    homographic: 1.0  # FIXED: Homographic consistency (SuperPoint-style)
    peakiness: 5.0    # FIXED: Much stronger (ALIKE dispersity + variance)
    offset: 0.15      # FIXED: Lowered (offsets should be subtle)

  # Stage 2 weight (uncertainty only)
  uncertainty_weight: 1.0

  # Descriptor loss parameters
  desc_temperature: 0.07  # InfoNCE temperature (lower = harder)

  # Repeatability loss parameters
  repeat_threshold: 2.0   # Not used (we use MSE)

  # Peakiness loss parameters
  target_variance: 0.22   # Target saliency variance
  sparsity_target: 0.35   # Target mean activation (35%)

# Training configuration - TWO STAGES
training:
  # Stage 1: Detector + Descriptor
  stage1_epochs: 40       # Train detector + descriptor first

  # Stage 2: Uncertainty
  stage2_epochs: 20       # Then train uncertainty (frozen detector + descriptor)

  # Total
  total_epochs: 60        # 40 + 20

  # Optimizer
  batch_size: 4
  lr: 1e-4                # Stage 1 learning rate
  lr_stage2: 1e-5         # Stage 2 learning rate (lower!)
  lr_min: 1e-6
  weight_decay: 1e-4
  grad_clip: 1.0

  # Data
  num_workers: 4

  # Validation & Saving
  val_interval: 1
  save_interval: 5
  save_dir: "checkpoints"

# Logging configuration
logging:
  use_wandb: false
  project: "semantic-slam-thesis"
  run_name: "two-stage-subpixel-v1"
  log_interval: 50

# ==============================================================================
# ARCHITECTURE RATIONALE (for thesis documentation):
# ==============================================================================
#
# Two-Stage Training (R2D2 methodology):
#   Stage 1 (epochs 1-40):
#     - Train keypoint selector with sub-pixel refinement
#     - Train descriptor refiner for discriminative features
#     - Use 4 essential losses (no bloat)
#
#   Stage 2 (epochs 41-60):
#     - FREEZE selector and refiner (no gradients!)
#     - Train uncertainty estimator only
#     - Prevents catastrophic forgetting of descriptors
#
# Loss Design (literature-based):
#   1. Descriptor (w=10.0): Dominant loss for discriminative learning (R2D2)
#   2. Repeatability (w=0.5): Consistent detection (SuperPoint)
#   3. Peakiness (w=1.0): Non-uniform, peaked detector (R2D2)
#   4. Offset (w=0.3): Sub-pixel accuracy (R2D2 implicit)
#
# DROPPED losses (not in SOTA literature):
#   ❌ Edge awareness (hand-crafted heuristic)
#   ❌ Separate activation loss (merged into peakiness)
#   ❌ Separate variance loss (merged into peakiness)
#   ❌ Spatial sparsity (NMS handles this)
#
# Sub-Pixel Refinement (R2D2-style):
#   - Predict (dx, dy) offsets in [-1, 1]
#   - Refine integer grid coordinates
#   - Improves repeatability by ~10% (R2D2 paper)
#
# Expected Improvements:
#   - Descriptor quality: 30% → 70%+ (two-stage training)
#   - Repeatability: 65% → 75%+ (sub-pixel refinement)
#   - ATE improvement: 15% → 20%+ (better features)
#   - Real-time: Still 20-30 FPS (minimal overhead)
# ==============================================================================